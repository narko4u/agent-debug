[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agent-debug"
version = "0.1.0"
description = "Agent Execution Inspector & Replay SDK — instrument AI agents to capture full execution traces and replay them step-by-step for debugging"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AgentDebug", email = "hello@agentdebug.dev"}
]
requires-python = ">=3.9"
keywords = ["agent", "debug", "replay", "trace", "ai", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://agentdebug.dev"
Repository = "https://github.com/agentdebug/agent-debug"
Documentation = "https://agentdebug.dev/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
